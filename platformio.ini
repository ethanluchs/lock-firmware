[platformio]
; `pio run` builds the board firmware only; the native env is for tests.
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=1

; Same firmware driving a hobby servo instead of the LED (ACT-003).
;   pio run -e servo -t upload
[env:servo]
extends = env:esp32doit-devkit-v1
build_flags =
  ${env:esp32doit-devkit-v1.build_flags}
  -DACTUATOR_SERVO

; Host-side unit tests for the pure libraries in lib/ (needs gcc on PATH):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
